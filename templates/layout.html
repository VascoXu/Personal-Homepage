<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}{% endblock %}</title>
  <!-- Google Font -->
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap" rel="stylesheet">
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['Noto Sans', 'sans-serif'],
          }
        }
      }
    }
  </script>
  <link rel="stylesheet" href="{{url_for('static',filename='dist/css/tailwind.css')}}">
  <link rel="stylesheet" href="static/styles/custom.css">
</head>
<body class="font-sans flex flex-col min-h-screen">

  <div class="flex-grow">
    <!-- Navbar -->
    <nav class="bg-white">
      <div class="mx-auto max-w-7xl mt-6 px-2 sm:px-6 lg:px-8">
        <div class="relative flex h-16 items-center justify-between">
          <div class="flex flex-1 items-center justify-center sm:items-stretch sm:justify-start">
            <!-- Name -->
            <div class="flex flex-shrink-0 items-center">
              <a href="/" class="text-3xl font-bold">VASCO XU</a>
            </div>
          </div>
        </div>
      </div>
    </nav>

      <!-- Main Body Section -->
      <main>
        {% block body %}
        {% endblock %}
    </main>
  </div>

    <!-- Footer -->
    <footer class="text-center border-t border-gray-200 py-4">
      <p class="sm:text-center text-sm text-gray-500">&copy; 2026 Vasco Xu. No rights reserved.</p>
    </footer>

    <!-- JavaScript file -->
    <script src="static/scripts/scripts.js"></script>
</body>
</html>
